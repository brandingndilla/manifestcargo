# netlify.toml - Place this file in the root of your project

[build]
  # Command to build your React app
  command = "cd client && npm install && npm run build"
  
  # Where the build output is located
  publish = "client/build"

# Handle all routes with React Router (prevents 404 on refresh)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Proxy API requests to your Render backend
# Replace YOUR_BACKEND_URL with your actual Render URL
[[redirects]]
  from = "/api/*"
  to = "https://your-backend.onrender.com/api/:splat"
  status = 200
  force = true

# Security Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "public, max-age=31536000, immutable"

# Cache static assets for better performance
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"